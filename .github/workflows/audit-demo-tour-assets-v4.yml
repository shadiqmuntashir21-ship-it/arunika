name: Audit Demo tour assets v4

on:
  push:
    branches: [demo-tour-assets-v4]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-tour-assets-v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify local showcase media
        run: |
          set -e
          test -f public/demo/books/atomic-habits.jpg
          test -f public/demo/books/psychology-of-money.jpg
          test -f public/demo/books/deep-work.jpg
          test -f public/demo/books/essentialism.jpg
          test -f public/demo/books/make-time.jpg
          test -f public/demo/books/thinking-fast-slow.jpg
          test -f public/demo/learning/ali-abdaal-study.jpg
          test -f public/demo/learning/raditya-genz.jpg
          test -f public/demo/learning/huberman-focus.jpg
          test -f public/demo/learning/huberman-study.jpg
          ! grep -q 'covers.openlibrary.org' lib/demo-data.ts
          ! grep -q 'i.ytimg.com' lib/demo-data.ts
          ! grep -q 'covers.openlibrary.org' app/page.tsx
          ! grep -q 'i.ytimg.com' app/page.tsx
          ! grep -q 'covers.openlibrary.org' lib/tour.ts
          ! grep -q 'i.ytimg.com' lib/tour.ts
      - run: npm ci
      - run: npm run build
      - name: Verify Tour and PWA
        run: |
          grep -q 'Mulai Tour Fitur' components/ArunikaApp.tsx
          grep -q '10 · SELESAI' components/ProductTour.tsx
          grep -q 'display.*standalone' public/manifest.webmanifest
          grep -q 'arunika-v8-demo-assets' public/sw.js
          test -f public/icons/icon-192.png
          test -f public/icons/icon-512.png
          test -f public/icons/icon-maskable-512.png
      - name: Cleanup one-shot workflow
        run: rm .github/workflows/audit-demo-tour-assets-v4.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Demo tour and asset audit'
          git push origin HEAD:demo-tour-assets-v4
