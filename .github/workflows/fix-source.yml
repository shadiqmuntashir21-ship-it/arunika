name: Fix Arunika source imports

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          sed -i 's/import { useState } from "react";/import { useEffect, useState } from "react";/' components/ArunikaViews.tsx
          rm .github/workflows/fix-source.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Arunika view imports"
          git push
