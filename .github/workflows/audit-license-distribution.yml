name: Audit license distribution status

on:
  push:
    branches: [license-distribution-status]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: license-distribution-status
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Verify distribution UI and PWA
        run: |
          grep -q 'Tandai Sudah Diberikan' app/admin/page.tsx
          grep -q 'keluar dari stok otomatis' app/admin/page.tsx
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/icons/icon-192.png
          test -f public/icons/icon-512.png
          test -f public/icons/icon-maskable-512.png
          grep -q 'display.*standalone' public/manifest.webmanifest
          grep -q 'arunika-v8-demo-assets' public/sw.js
      - name: Cleanup one-shot workflow
        run: rm .github/workflows/audit-license-distribution.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete license distribution audit'
          git push origin HEAD:license-distribution-status
