name: Audit UI system v3

on:
  push:
    branches: [ui-system-audit-v3]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-system-audit-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Verify PWA untouched
        run: |
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/icons/icon-192.png
          test -f public/icons/icon-512.png
          test -f public/icons/icon-maskable-512.png
          grep -q 'display.*standalone' public/manifest.webmanifest
      - name: Cleanup one-shot workflow
        run: rm .github/workflows/audit-ui-v3.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete UI system v3 audit"
          git push origin HEAD:ui-system-audit-v3
