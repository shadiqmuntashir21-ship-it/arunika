name: Final Growva rebrand audit

on:
  push:
    branches: [growva-ui-rebrand]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growva-ui-rebrand
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render maskable Growva icon
        run: |
          pip install cairosvg
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          cairosvg.svg2png(url='public/icons/icon-maskable.svg',write_to='public/icons/icon-maskable-512.png',output_width=512,output_height=512)
          assert Path('public/icons/icon-maskable-512.png').stat().st_size > 5000
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Verify Growva branding
        run: |
          set -e
          grep -q 'Growva — Reading & Learning Tracker' public/manifest.webmanifest
          grep -q 'short_name.*Growva' public/manifest.webmanifest
          grep -q 'aria-label="Growva"' public/favicon.svg
          grep -q 'aria-label="Growva"' public/icons/icon.svg
          grep -q 'aria-label="Growva"' public/icons/icon-maskable.svg
          grep -q 'aria-label="Growva"' app/icon.svg
          grep -q 'growva-v1-brand' public/sw.js
          grep -q 'display.*standalone' public/manifest.webmanifest
          grep -q 'Catat yang dibaca. Simpan yang dipelajari. Tumbuh setiap hari.' app/layout.tsx
          grep -q 'READ' app/page.tsx
          grep -q 'Growva' app/page.tsx
          grep -q 'Growva' app/pro/page.tsx
          grep -q 'Growva' app/activate/page.tsx
          grep -q 'Growva' app/admin/page.tsx
          grep -q 'Growva' components/ArunikaApp.tsx
          grep -q 'Growva' components/ArunikaViews.tsx
          grep -q 'Growva' components/AppControls.tsx
          grep -q 'Growva' components/ProductTour.tsx
          ! grep -qE 'Arunika|ARUNIKA' app/page.tsx app/pro/page.tsx app/admin/page.tsx components/ArunikaViews.tsx components/AppControls.tsx components/ProductTour.tsx public/manifest.webmanifest public/favicon.svg public/icons/icon.svg public/icons/icon-maskable.svg app/icon.svg
          grep -q 'PRODUCT_CODE = "ARUNIKA"' lib/backend.ts
          grep -q 'arunika_device_id' lib/backend.ts
          grep -q 'arunika-theme' app/layout.tsx
          test -f public/icons/icon-192.png
          test -f public/icons/icon-512.png
          test -f public/icons/icon-maskable-512.png
          test -f public/icons/apple-touch-icon.png
          test $(stat -c%s public/icons/icon-192.png) -gt 5000
          test $(stat -c%s public/icons/icon-512.png) -gt 10000
      - name: Remove one-shot workflow
        run: rm .github/workflows/final-growva-rebrand-audit.yml
      - name: Commit final brand assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/icons/icon-maskable-512.png .github/workflows/final-growva-rebrand-audit.yml
          git commit -m 'Complete Growva rebrand audit'
          git push origin HEAD:growva-ui-rebrand
