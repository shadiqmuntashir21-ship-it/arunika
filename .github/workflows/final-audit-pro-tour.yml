name: Final audit Pro hands-on tour

on:
  push:
    branches: [pro-hands-on-tour]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pro-hands-on-tour
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Verify guided tour targets
        run: |
          grep -q 'data-tour-action="add-book"' components/ArunikaViews.tsx
          grep -q 'data-tour-action="add-session"' components/ArunikaViews.tsx
          grep -q 'data-tour-action="add-learning"' components/ArunikaViews.tsx
          grep -q 'data-tour-action="log-learning"' components/ArunikaViews.tsx
          grep -q 'data-tour-panel="knowledge"' components/ArunikaViews.tsx
          grep -q 'data-tour-panel="insights"' components/ArunikaViews.tsx
      - name: Verify PWA untouched
        run: |
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/icons/icon-192.png
          test -f public/icons/icon-512.png
          test -f public/icons/icon-maskable-512.png
          grep -q 'display.*standalone' public/manifest.webmanifest
      - name: Cleanup one-shot workflow
        run: rm .github/workflows/final-audit-pro-tour.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete final Pro tour audit"
          git push origin HEAD:pro-hands-on-tour
