name: Audit PWA tour premium

on:
  push:
    branches: [pwa-tour-premium]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pwa-tour-premium
      - name: Generate install-ready PNG icons
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 192 -h 192 public/icons/icon.svg -o public/icons/icon-192.png
          rsvg-convert -w 512 -h 512 public/icons/icon.svg -o public/icons/icon-512.png
          rsvg-convert -w 512 -h 512 public/icons/icon-maskable.svg -o public/icons/icon-maskable-512.png
          rsvg-convert -w 180 -h 180 public/icons/icon.svg -o public/icons/apple-touch-icon.png
          file public/icons/icon-192.png public/icons/icon-512.png public/icons/icon-maskable-512.png public/icons/apple-touch-icon.png
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Cleanup one-shot workflow
        run: rm .github/workflows/audit-pwa-tour-premium.yml
      - name: Commit generated icons and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete PWA tour premium audit"
          git push origin HEAD:pwa-tour-premium
