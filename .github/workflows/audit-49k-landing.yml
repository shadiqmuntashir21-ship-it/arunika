name: Audit 49K conversion landing

on:
  push:
    branches: [landing-conversion-49k]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landing-conversion-49k
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Remove one-shot workflow
        run: rm .github/workflows/audit-49k-landing.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete 49K landing build audit"
          git push origin HEAD:landing-conversion-49k
